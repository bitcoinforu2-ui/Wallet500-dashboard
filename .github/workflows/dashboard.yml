name: Sync and deploy Wallet500 dashboard
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '3-59/10 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: dashboard-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Sync the sanitized engine projection
        env:
          SOURCE_TOKEN: ${{ secrets.DASHBOARD_SOURCE_TOKEN }}
        run: python3 scripts/sync_runtime.py
      - name: Save changed projection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/v2-runtime-status.json
          if ! git diff --cached --quiet; then
            git commit -m "data: sync engine dashboard projection [skip ci]"
            git push
          fi
      - name: Build static dashboard
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp data/v2-runtime-status.json _site/data/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deploy
